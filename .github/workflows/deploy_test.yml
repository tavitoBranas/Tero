name: Deploy TEST
on:
  workflow_call:

jobs:
 
  # ──────────────────────────────────────────────
  # JOB 1: Despliegue en TEST
  # ──────────────────────────────────────────────

  deploy-test:
    name: Deploy TEST
    runs-on: ubuntu-latest

    environment: test

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: tero-eks
      NAMESPACE: ${{ vars.NAMESPACE }}
      REPLICAS: ${{ vars.REPLICAS }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_ENDPOINT: ${{ vars.DB_ENDPOINT }}
      REDIS_URL: ${{ vars.REDIS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configuracion de credenciales de AWS
        uses: aws-actions/configure-aws-credentials@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 # v4.0.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configuracion de acceso a K8s
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verificacion del namespace
        run: kubectl get namespace "$NAMESPACE"

      - name: Descarga de los digests de las imagenes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Verificacion de los digests
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do
            FILE="image-digests/$SERVICE.txt"

            if [ ! -s "$FILE" ]; then
              echo "::error::Referencia no encontrada para $SERVICE"
              exit 1
            fi

            IMAGE_URI=$(cat "$FILE")

            if [[ ! "$IMAGE_URI" =~ @sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Digest inválido para $SERVICE"
              exit 1
            fi

            echo "$SERVICE: $IMAGE_URI"
          done

      - name: CReacion del secreto para Admin
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        run: |
          kubectl create secret generic admin-secret \
            --namespace "$NAMESPACE" \
            --from-literal=ADMIN_USERNAME="$ADMIN_USERNAME" \
            --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            --from-literal=ADMIN_JWT_SECRET="$ADMIN_JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Servicio TEST
        shell: bash
        run: |
          for FILE in k8s/services/*.yaml; do
            envsubst '${NAMESPACE}' < "$FILE" | kubectl apply -f -
          done

      - name: Deploy MicroservicIOS TEST
        shell: bash
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do

            IMAGE_URI=$(cat "image-digests/$SERVICE.txt")
            export IMAGE_URI

            echo "Desplegando $SERVICE"
            echo "Imagen: $IMAGE_URI"

            envsubst '${NAMESPACE} ${REPLICAS} ${IMAGE_URI} ${DB_HOST} ${DB_ENDPOINT} ${REDIS_URL}' \
              < "k8s/deployments/$SERVICE.yaml" \
              | kubectl apply -f -

          done

      - name: Verificacion del Deployment
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do

            echo "Verificando $SERVICE"

            kubectl rollout status deployment/"$SERVICE" \
              --namespace "$NAMESPACE" \
              --timeout=300s

          done

      - name: Deploy Ingress TEST 
        shell: bash
        run: |
          for FILE in k8s/ingress/*.yaml; do
            envsubst '${NAMESPACE}' < "$FILE" | kubectl apply -f -
          done

      - name: Espera por el ALB TEST
        id: alb
        shell: bash
        run: |
          for ATTEMPT in $(seq 1 60); do

            ALB_HOST=$(kubectl get ingress \
              --namespace "$NAMESPACE" \
              -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')

            if [ -n "$ALB_HOST" ]; then
              echo "ALB disponible: $ALB_HOST"
              echo "hostname=$ALB_HOST" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Esperando ALB - Intento $ATTEMPT de 60"
            sleep 10

          done

          echo "::error::No se obtuvo la dirección del ALB"
          exit 1

      - name: Verificacion del Health de ALB TEST
        shell: bash
        env:
          ALB_HOST: ${{ steps.alb.outputs.hostname }}
        run: |
          for PORT in 80 8081; do

            echo "Verificando ALB en puerto $PORT"

            curl --fail --silent --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 30 \
              --retry-delay 10 \
              --retry-all-errors \
              "http://$ALB_HOST:$PORT/health"

            echo ""
            echo "Puerto $PORT: OK"

          done

          echo "UI: http://$ALB_HOST"
          echo "Admin: http://$ALB_HOST:8081"

#### PRUEBAS FUNCIONALES


      - name: Registrar revision validada en TEST
        shell: bash
        run: |
          git rev-parse 'HEAD^{tree}' > validated-tree.txt

      - name: Publicar revision validada en TEST
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-tree
          path: validated-tree.txt
          retention-days: 30
          if-no-files-found: error