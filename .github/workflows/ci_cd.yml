  trivy_filesystem:
    name: Analisis de Trivy modo Filesystem
    runs-on: ubuntu-latest
    #needs: gitleaks

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Escaneo Trivy Filesystem
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 #v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          ignorefile: '.trivyignore'  # eliminar posteriormente a la creacion de la imagen 
          format: 'json'
          output: 'trivy-fs.json'
          exit-code: '0'

      - name: Quality Gate - trivy_filesystem
        run: |
          echo "Vulnerabilidades HIGH o CRITICAL sin parche informado:"

          jq -r '
            .Results[]?.Vulnerabilities[]?
            | select(
                (.Severity == "CRITICAL" or .Severity == "HIGH")
                and (.FixedVersion == null or .FixedVersion == "")
              )
            | "\(.VulnerabilityID) | Paquete: \(.PkgName) | Severidad: \(.Severity) | Version: \(.InstalledVersion)"
          ' trivy-fs.json

          jq -e '
            [.Results[]?.Vulnerabilities[]?
             | select(
                 (.Severity == "CRITICAL" or .Severity == "HIGH")
                 and (.FixedVersion == null or .FixedVersion == "")
               )
            ] | length == 0
          ' trivy-fs.json

  trivy_image:
    name: Analisis de Trivy modo imagen
    runs-on: ubuntu-latest
    needs: trivy_filesystem
  
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

###############################################################################
        # provisoriamente se construye la imagen par testeo de trivy. Esto debera considerarse en la construccion del contenedor

      - name: Build imagen (sin push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 #v5
        with:
          context: ./src/checkout   
          push: false # no carga la imagen a un repo
          load: true # mantiene la imagen dentro del runner para disponibilizarla para el prox step
          tags: lab-github-actions:${{ github.sha }}

###############################################################################

      - name: Escaneo Trivy Image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'lab-github-actions:${{ github.sha }}'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          ignorefile: '.trivyignore'  # eliminar posteriormente a la creacion de la imagen 
          format: 'json'
          output: 'trivy-image.json'
          exit-code: '0'

      - name: Quality Gate - trivy_image
        run: |
            jq -e '
            [.Results[]?.Vulnerabilities[]?
            | select(
                 (.Severity == "CRITICAL" or .Severity == "HIGH")
                 and (.FixedVersion == null or .FixedVersion == "")
               )
            ] | length == 0
            ' trivy-image.json
