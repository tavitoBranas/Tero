name: Tero CICD

#no va a existir un push directo a main, siempre ira por PR
#se agrega capacidad de ejecusion manual

on:
  # Se ejecuta cuando termina el pipeline Terraform
  # Se utiliza workflow_call para ejecutar la version del CI/CD incluida en el PR

######### DESCOMENTAR ESTO

  workflow_call:

  # Permite ejecución manual
  workflow_dispatch:

# Evita ejecuciones simultaneas del pipeline
concurrency:
  group: tero-cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ──────────────────────────────────────────────
  # JOB 1: Build, Trivy image y push al ECR
  # ──────────────────────────────────────────────

  build-trivyImage-push:
    name: Build & Push de imagen - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - admin
          - cart
          - catalog
          - checkout
          - orders
          - ui

    steps:
      # consytruye el mismo codigo commit que activo terraform
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 #v4.0.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Logeo en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 #v2.1.7

      - name: Build Docker image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          IMAGE_URI="$REGISTRY/tero-$SERVICE:$IMAGE_TAG"

          docker build \
            --label "git.sha=$IMAGE_TAG" \
            --label "git.branch=$BRANCH" \
            --label "build.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE_URI" \
            "./src/$SERVICE"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Escaneo Trivy Image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.build.outputs.image_uri }}
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          trivyignores: '.trivyignore'
          format: 'json'
          output: 'trivy-image.json'
          exit-code: '0'

      - name: Quality Gate - trivy_image
        run: |
          echo "Vulnerabilidades HIGH o CRITICAL sin parche informado:"

          jq -r '
            .Results[]?.Vulnerabilities[]?
            | select(
                (.Severity == "CRITICAL" or .Severity == "HIGH")
                and (.FixedVersion == null or .FixedVersion == "")
              )
            | "\(.VulnerabilityID) | Paquete: \(.PkgName) | Severidad: \(.Severity) | Version: \(.InstalledVersion)"
          ' trivy-image.json

          jq -e '
            [.Results[]?.Vulnerabilities[]?
            | select(
                (.Severity == "CRITICAL" or .Severity == "HIGH")
                and (.FixedVersion == null or .FixedVersion == "")
              )
            ] | length == 0
          ' trivy-image.json

      - name: Push image to ECR
        run: docker push "${{ steps.build.outputs.image_uri }}"

      - name: Obtener digest de la imagen
        id: digest
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "tero-$SERVICE" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ "$DIGEST" != sha256:* ]]; then
            echo "::error::No se pudo obtener el digest"
            exit 1
          fi

          IMAGE_URI="$REGISTRY/tero-$SERVICE@$DIGEST"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Imagen publicada: $IMAGE_URI"

      - name: Guardar referencia de la imagen
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_URI: ${{ steps.digest.outputs.image_uri }}
        run: |
          mkdir -p image-digests
          printf '%s\n' "$IMAGE_URI" > "image-digests/$SERVICE.txt"

      - name: Publicar referencia de la imagen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest-${{ matrix.service }}
          path: image-digests/${{ matrix.service }}.txt
          retention-days: 1
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # JOB 2: Preparar bases de datos TEST
  # ──────────────────────────────────────────────

  prepare-test-databases:
    name: Prepare TEST Databases
    runs-on: ubuntu-latest
    needs: build-trivyImage-push

    environment: test

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: tero-eks
      NAMESPACE: ${{ vars.NAMESPACE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 # v4.0.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verify namespace
        run: kubectl get namespace "$NAMESPACE"

      - name: Create PostgreSQL Secret
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          kubectl create secret generic postgres-secret \
            --namespace "$NAMESPACE" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy TEST Databases
        run: |
          for FILE in k8s/database/*.yaml; do
            envsubst '${NAMESPACE}' < "$FILE" | kubectl apply -f -
          done

      - name: Verify TEST Databases
        run: |
          kubectl rollout status deployment/postgres \
            --namespace "$NAMESPACE" \
            --timeout=300s

          kubectl rollout status deployment/redis \
            --namespace "$NAMESPACE" \
            --timeout=300s


  # ──────────────────────────────────────────────
  # JOB 3: Despliegue en DEV
  # ──────────────────────────────────────────────

  deploy-dev:
    name: Deploy DEV
    runs-on: ubuntu-latest
    needs: prepare-test-databases

    environment: dev

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: tero-eks
      NAMESPACE: ${{ vars.NAMESPACE }}
      REPLICAS: ${{ vars.REPLICAS }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_ENDPOINT: ${{ vars.DB_ENDPOINT }}
      REDIS_URL: ${{ vars.REDIS_URL }}

    steps:

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 # v4.0.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verify namespace
        run: kubectl get namespace "$NAMESPACE"

      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Verify image digests
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do
            FILE="image-digests/$SERVICE.txt"

            if [ ! -s "$FILE" ]; then
              echo "::error::Referencia no encontrada para $SERVICE"
              exit 1
            fi

            IMAGE_URI=$(cat "$FILE")

            if [[ ! "$IMAGE_URI" =~ @sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Digest inválido para $SERVICE"
              exit 1
            fi

            echo "$SERVICE: $IMAGE_URI"
          done

      - name: Create Admin Secret
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        run: |
          kubectl create secret generic admin-secret \
            --namespace "$NAMESPACE" \
            --from-literal=ADMIN_USERNAME="$ADMIN_USERNAME" \
            --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            --from-literal=ADMIN_JWT_SECRET="$ADMIN_JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create PostgreSQL Secret
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          kubectl create secret generic postgres-secret \
            --namespace "$NAMESPACE" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy DEV Services
        run: |
          for FILE in k8s/services/*.yaml; do
            envsubst '${NAMESPACE}' < "$FILE" | kubectl apply -f -
          done

      - name: Deploy DEV Microservices
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do

            export IMAGE_URI=$(cat "image-digests/$SERVICE.txt")

            echo "Desplegando $SERVICE"
            echo "Imagen: $IMAGE_URI"

            envsubst '${NAMESPACE} ${REPLICAS} ${IMAGE_URI} ${DB_HOST} ${DB_ENDPOINT} ${REDIS_URL}' \
              < "k8s/deployments/$SERVICE.yaml" \
              | kubectl apply -f -

          done

      - name: Verify DEV Deployments
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do

            echo "Verificando $SERVICE"

            kubectl rollout status deployment/"$SERVICE" \
              --namespace "$NAMESPACE" \
              --timeout=300s

          done

      - name: Verify DEV Health
        shell: bash
        run: |
          kubectl run "health-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --namespace "$NAMESPACE" \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm -i \
            --command -- sh -ec '
              for SERVICE in admin carts catalog checkout orders ui; do

                echo "Verificando health de $SERVICE"

                curl --fail --silent --show-error \
                  --connect-timeout 5 \
                  --max-time 15 \
                  --retry 3 \
                  "http://$SERVICE:8080/health"

                echo ""
                echo "$SERVICE: OK"

              done
            '
  # ──────────────────────────────────────────────
  # JOB 4: Despliegue en TEST
  # ──────────────────────────────────────────────

  deploy-test:
    name: Deploy TEST
    runs-on: ubuntu-latest
    needs: deploy-dev

    environment: test

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: tero-eks
      NAMESPACE: ${{ vars.NAMESPACE }}
      REPLICAS: ${{ vars.REPLICAS }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_ENDPOINT: ${{ vars.DB_ENDPOINT }}
      REDIS_URL: ${{ vars.REDIS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 # v4.0.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verify namespace
        run: kubectl get namespace "$NAMESPACE"

      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Verify image digests
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do
            FILE="image-digests/$SERVICE.txt"

            if [ ! -s "$FILE" ]; then
              echo "::error::Referencia no encontrada para $SERVICE"
              exit 1
            fi

            IMAGE_URI=$(cat "$FILE")

            if [[ ! "$IMAGE_URI" =~ @sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Digest inválido para $SERVICE"
              exit 1
            fi

            echo "$SERVICE: $IMAGE_URI"
          done

      - name: Create Admin Secret
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        run: |
          kubectl create secret generic admin-secret \
            --namespace "$NAMESPACE" \
            --from-literal=ADMIN_USERNAME="$ADMIN_USERNAME" \
            --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            --from-literal=ADMIN_JWT_SECRET="$ADMIN_JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy TEST Services
        shell: bash
        run: |
          for FILE in k8s/services/*.yaml; do
            envsubst '${NAMESPACE}' < "$FILE" | kubectl apply -f -
          done

      - name: Deploy TEST Microservices
        shell: bash
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do

            IMAGE_URI=$(cat "image-digests/$SERVICE.txt")
            export IMAGE_URI

            echo "Desplegando $SERVICE"
            echo "Imagen: $IMAGE_URI"

            envsubst '${NAMESPACE} ${REPLICAS} ${IMAGE_URI} ${DB_HOST} ${DB_ENDPOINT} ${REDIS_URL}' \
              < "k8s/deployments/$SERVICE.yaml" \
              | kubectl apply -f -

          done

      - name: Verify TEST Deployments
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do

            echo "Verificando $SERVICE"

            kubectl rollout status deployment/"$SERVICE" \
              --namespace "$NAMESPACE" \
              --timeout=300s

          done

      - name: Deploy TEST Ingress
        shell: bash
        run: |
          for FILE in k8s/ingress/*.yaml; do
            envsubst '${NAMESPACE}' < "$FILE" | kubectl apply -f -
          done

      - name: Wait for TEST ALB
        id: alb
        shell: bash
        run: |
          for ATTEMPT in $(seq 1 60); do

            ALB_HOST=$(kubectl get ingress \
              --namespace "$NAMESPACE" \
              -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')

            if [ -n "$ALB_HOST" ]; then
              echo "ALB disponible: $ALB_HOST"
              echo "hostname=$ALB_HOST" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Esperando ALB - Intento $ATTEMPT de 60"
            sleep 10

          done

          echo "::error::No se obtuvo la dirección del ALB"
          exit 1

      - name: Verify TEST ALB Health
        shell: bash
        env:
          ALB_HOST: ${{ steps.alb.outputs.hostname }}
        run: |
          for PORT in 80 8081; do

            echo "Verificando ALB en puerto $PORT"

            curl --fail --silent --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 30 \
              --retry-delay 10 \
              --retry-all-errors \
              "http://$ALB_HOST:$PORT/health"

            echo ""
            echo "Puerto $PORT: OK"

          done

          echo "UI: http://$ALB_HOST"
          echo "Admin: http://$ALB_HOST:8081"