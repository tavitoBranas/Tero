  # ──────────────────────────────────────────────
  # JOB 4: Build, Trivy image y push al ECR
  # ──────────────────────────────────────────────

  build-and-push:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    name: Build & Push de imagen - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          #- admin
          #- cart
          #- catalog
          #- checkout
          #- orders
          - ui

    steps:

      # consytruye el mismo codigo commit que activo terraform
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 #v4.0.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Logeo en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 #v2.1.7

      - name: Build Docker image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          IMAGE_URI="$REGISTRY/tero-$SERVICE:$IMAGE_TAG"

          docker build \
            --label "git.sha=${{ github.event.workflow_run.head_sha }}" \
            --label "git.branch=${{ github.event.workflow_run.head_branch }}" \
            --label "build.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE_URI" \
            "./src/$SERVICE"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Escaneo Trivy Image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.build.outputs.image_uri }}
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          ignorefile: '.trivyignore'
          format: 'json'
          output: 'trivy-image.json'
          exit-code: '0'

      - name: Quality Gate - trivy_image
        run: |
          echo "Vulnerabilidades HIGH o CRITICAL sin parche informado:"

          jq -r '
            .Results[]?.Vulnerabilities[]?
            | select(
                (.Severity == "CRITICAL" or .Severity == "HIGH")
                and (.FixedVersion == null or .FixedVersion == "")
              )
            | "\(.VulnerabilityID) | Paquete: \(.PkgName) | Severidad: \(.Severity) | Version: \(.InstalledVersion)"
          ' trivy-image.json

          jq -e '
            [.Results[]?.Vulnerabilities[]?
            | select(
                (.Severity == "CRITICAL" or .Severity == "HIGH")
                and (.FixedVersion == null or .FixedVersion == "")
              )
            ] | length == 0
          ' trivy-image.json

      - name: Push image to ECR
        run: docker push "${{ steps.build.outputs.image_uri }}"
