name: Build, Trivy image y push

on:
  workflow_call:

jobs:

  # ──────────────────────────────────────────────
  # JOB 1: Build, Trivy image y push al ECR
  # ──────────────────────────────────────────────

  build-trivyImage-push:
    name: Build & Push de la imagen - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - admin
          - cart
          - catalog
          - checkout
          - orders
          - ui

    steps:
      # consytruye el mismo codigo commit que activo terraform
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configuracion de credenciales de AWS
        uses: aws-actions/configure-aws-credentials@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 #v4.0.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Logeo en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 #v2.1.7

      - name: Build Docker image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          IMAGE_URI="$REGISTRY/tero-$SERVICE:$IMAGE_TAG"

          docker build \
            --label "git.sha=$IMAGE_TAG" \
            --label "git.branch=$BRANCH" \
            --label "build.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE_URI" \
            "./src/$SERVICE"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Escaneo Trivy Image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.build.outputs.image_uri }}
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          trivyignores: '.trivyignore'
          format: 'json'
          output: 'trivy-image.json'
          exit-code: '0'

      - name: Quality Gate - trivy_image
        run: |
          echo "Vulnerabilidades HIGH o CRITICAL sin parche informado:"

          jq -r '
            .Results[]?.Vulnerabilities[]?
            | select(
                (.Severity == "CRITICAL" or .Severity == "HIGH")
                and (.FixedVersion == null or .FixedVersion == "")
              )
            | "\(.VulnerabilityID) | Paquete: \(.PkgName) | Severidad: \(.Severity) | Version: \(.InstalledVersion)"
          ' trivy-image.json

          jq -e '
            [.Results[]?.Vulnerabilities[]?
            | select(
                (.Severity == "CRITICAL" or .Severity == "HIGH")
                and (.FixedVersion == null or .FixedVersion == "")
              )
            ] | length == 0
          ' trivy-image.json

      - name: Push image a ECR
        run: docker push "${{ steps.build.outputs.image_uri }}"

      - name: Obtener digest de la imagen
        id: digest
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "tero-$SERVICE" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ "$DIGEST" != sha256:* ]]; then
            echo "::error::No se pudo obtener el digest"
            exit 1
          fi

          IMAGE_URI="$REGISTRY/tero-$SERVICE@$DIGEST"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Imagen publicada: $IMAGE_URI"

      - name: Guardar referencia de la imagen
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_URI: ${{ steps.digest.outputs.image_uri }}
        run: |
          mkdir -p image-digests
          printf '%s\n' "$IMAGE_URI" > "image-digests/$SERVICE.txt"

      - name: Publicar referencia de la imagen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest-${{ matrix.service }}
          path: image-digests/${{ matrix.service }}.txt
          retention-days: 1
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # JOB 2: Tero - Deploy DEV
  # ──────────────────────────────────────────────

  deploy_dev:
    name: Tero - Deploy DEV
    needs: build-trivyImage-push
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/deploy_dev.yml
    secrets: inherit