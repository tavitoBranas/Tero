name: Deploy PROD

on:
    push:
      branches: [main]

permissions:
  contents: read

concurrency:
  group: tero-terraform
  cancel-in-progress: false

jobs:
  
  # ──────────────────────────────────────────────
  # JOB 1: Validacion del release
  # ──────────────────────────────────────────────
  validate-release:
    name: Validacion de la liberacion
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      pull-requests: read

    outputs:
      run_id: ${{ steps.validated_run.outputs.run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Identificar ejecucion validada del Pull Request
        id: validated_run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Identificar el PR asociado al merge
          PR_NUMBER=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "[.[] | select(
              .merged_at != null and
              .base.ref == \"main\" and
              .merge_commit_sha == \"$GITHUB_SHA\"
            )] | if length == 1 then .[0].number else empty end")

          if [ -z "$PR_NUMBER" ]; then
            echo "No se encontro el Pull Request asociado"
            exit 1
          fi

          echo "Pull Request: $PR_NUMBER"

          # Obtener el SHA de la rama integrada
          HEAD_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '.head.sha')

          # Buscar ejecuciones exitosas de la revision
          RUN_ID=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/qualityGates.yml/runs?event=pull_request&status=success&head_sha=$HEAD_SHA" \
            --paginate \
            --jq '.workflow_runs[] | .id' | sed -n '1p')

          if [ -z "$RUN_ID" ]; then
            echo "No se encontro una ejecucion exitosa del PR"
            exit 1
          fi

          echo "Ejecucion validada: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Descargar digests de las imagenes validadas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.validated_run.outputs.run_id }}
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Descargar revision validada en TEST
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.validated_run.outputs.run_id }}
          name: validated-tree
          path: validation

      - name: Verificar correspondencia del codigo validado
        shell: bash
        run: |
          set -euo pipefail

          VALIDATED_TREE=$(cat validation/validated-tree.txt)
          PROD_TREE=$(git rev-parse 'HEAD^{tree}')

          echo "Tree validado en TEST: $VALIDATED_TREE"
          echo "Tree integrado en main: $PROD_TREE"

          if [ "$VALIDATED_TREE" != "$PROD_TREE" ]; then
            echo "ERROR: El codigo integrado no coincide con el validado en TEST"
            exit 1
          fi

          echo "El codigo integrado coincide con el validado en TEST"

      - name: Verificacion de los digests
        shell: bash
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do

            FILE="image-digests/$SERVICE.txt"

            if [ ! -s "$FILE" ]; then
              echo "::error::Referencia no encontrada para $SERVICE"
              exit 1
            fi

            IMAGE_URI=$(cat "$FILE")

            if [[ ! "$IMAGE_URI" =~ @sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Digest inválido para $SERVICE"
              exit 1
            fi

            echo "$SERVICE: $IMAGE_URI"

          done

  # ──────────────────────────────────────────────
  # JOB 2: Preparar bases de datos PROD
  # ──────────────────────────────────────────────

  prepare-prod-databases:
    name: Prepare PROD Databases
    runs-on: ubuntu-latest
    needs: validate-release

    environment: prod

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: tero-eks
      NAMESPACE: ${{ vars.NAMESPACE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configuracion de credenciales de AWS
        uses: aws-actions/configure-aws-credentials@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 # v4.0.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configuracion de acceso a K8s
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verificacion del namespace
        run: kubectl get namespace "$NAMESPACE"

      - name: Creacion del secreto para PostgreSQL
        shell: bash
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          kubectl create secret generic postgres-secret \
            --namespace "$NAMESPACE" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy db PROD
        shell: bash
        run: |
          for FILE in k8s/database/*.yaml; do
            envsubst '${NAMESPACE}' < "$FILE" | kubectl apply -f -
          done

      - name: Verificacion db PROD
        run: |
          kubectl rollout status deployment/postgres \
            --namespace "$NAMESPACE" \
            --timeout=300s

          kubectl rollout status deployment/redis \
            --namespace "$NAMESPACE" \
            --timeout=300s

  # ──────────────────────────────────────────────
  # JOB 3: Despliegue en PROD
  # ──────────────────────────────────────────────

  deploy-prod:
    name: Deploy PROD
    runs-on: ubuntu-latest
    needs: [validate-release, prepare-prod-databases]

    permissions:
      contents: read
      actions: read

    environment: prod

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: tero-eks
      NAMESPACE: ${{ vars.NAMESPACE }}
      REPLICAS: ${{ vars.REPLICAS }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_ENDPOINT: ${{ vars.DB_ENDPOINT }}
      REDIS_URL: ${{ vars.REDIS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configuracion de credenciales de AWS
        uses: aws-actions/configure-aws-credentials@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 # v4.0.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configuracion de acceso a K8s
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Descargar digests de las imagenes validadas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate-release.outputs.run_id }}
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: CReacion del secreto para Admin
        shell: bash
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        run: |
          kubectl create secret generic admin-secret \
            --namespace "$NAMESPACE" \
            --from-literal=ADMIN_USERNAME="$ADMIN_USERNAME" \
            --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            --from-literal=ADMIN_JWT_SECRET="$ADMIN_JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Servicio PROD
        shell: bash
        run: |
          for FILE in k8s/services/*.yaml; do
            envsubst '${NAMESPACE}' < "$FILE" | kubectl apply -f -
          done

      - name: Deploy Microservicios PROD
        shell: bash
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do

            IMAGE_URI=$(cat "image-digests/$SERVICE.txt")
            export IMAGE_URI

            echo "Desplegando $SERVICE"
            echo "Imagen: $IMAGE_URI"

            envsubst '${NAMESPACE} ${REPLICAS} ${IMAGE_URI} ${DB_HOST} ${DB_ENDPOINT} ${REDIS_URL}' \
              < "k8s/deployments/$SERVICE.yaml" \
              | kubectl apply -f -

          done

      - name: Verificacion del Deployment
        shell: bash
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do

            echo "Verificando $SERVICE"

            kubectl rollout status deployment/"$SERVICE" \
              --namespace "$NAMESPACE" \
              --timeout=300s

          done

      - name: Deploy Ingress PROD
        shell: bash
        run: |
          for FILE in k8s/ingress/*.yaml; do
            envsubst '${NAMESPACE}' < "$FILE" | kubectl apply -f -
          done

      - name: Espera por el ALB PROD
        id: alb
        shell: bash
        run: |
          for ATTEMPT in $(seq 1 60); do

            ALB_HOST=$(kubectl get ingress \
              --namespace "$NAMESPACE" \
              -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')

            if [ -n "$ALB_HOST" ]; then
              echo "ALB disponible: $ALB_HOST"
              echo "hostname=$ALB_HOST" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Esperando ALB - Intento $ATTEMPT de 60"
            sleep 10

          done

          echo "::error::No se obtuvo la dirección del ALB"
          exit 1

      - name: Verificacion del Health de ALB PROD
        shell: bash
        env:
          ALB_HOST: ${{ steps.alb.outputs.hostname }}
        run: |
          for PORT in 80 8081; do

            echo "Verificando ALB en puerto $PORT"

            curl --fail --silent --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --retry 30 \
              --retry-delay 10 \
              --retry-all-errors \
              "http://$ALB_HOST:$PORT/health"

            echo ""
            echo "Puerto $PORT: OK"

          done

          echo "UI: http://$ALB_HOST"
          echo "Admin: http://$ALB_HOST:8081"