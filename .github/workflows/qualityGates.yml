name: Quality gates

on:
  # Se ejecuta al crear o actualizar un Pull Request
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

  # Permite ejecución manual
  workflow_dispatch:

# Evita ejecuciones simultáneas sobre el mismo state
concurrency:
  group: tero-terraform
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Sonarqube
  # ──────────────────────────────────────────────

  sonarqube:
    name: Test SonarQube
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # analisis de codigo y envio de su resultado a SOnarQube
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # corresponde a la version 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # espera el procesamiento de los resultados y su comprobacion final
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa #1.2.1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        # consulta a la API y valida que los codesmells sean <= 5
      - name: Validar nuevos Code Smells
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PARAMS=(
            --data-urlencode "component=tavitoBranas_Tero"
            --data-urlencode "metricKeys=new_code_smells"
          )

          if [ "$EVENT_NAME" = "pull_request" ]; then

            if [ -z "$PR_NUMBER" ]; then
              echo "::error::No se pudo identificar el PR"
              exit 1
            fi

            echo "Validando Code Smells del PR #$PR_NUMBER"
            PARAMS+=(--data-urlencode "pullRequest=$PR_NUMBER")

          else
            echo "Validando Code Smells de main"
            PARAMS+=(--data-urlencode "branch=main")
          fi

          AUTH=$(printf '%s:' "$SONAR_TOKEN" | base64 -w 0)

          RESPONSE=$(curl --fail --silent --show-error \
            --header "Authorization: Basic $AUTH" \
            --get "https://sonarcloud.io/api/measures/component" \
            "${PARAMS[@]}")

          COUNT=$(echo "$RESPONSE" | jq -er '
          .component.measures[]
          | select(.metric == "new_code_smells")
          | (.periods[0].value // .value)
          | tonumber
          ')

          echo "Nuevos Code Smells: $COUNT"

          if [ "$COUNT" -gt 5 ]; then
            echo "::error::Se superó el máximo de 5 nuevos Code Smells"
            exit 1
          fi

          echo "Control de Code Smells superado"

  # ──────────────────────────────────────────────
  # JOB 2: Gitleaks
  # ──────────────────────────────────────────────

  gitleaks:
    name: Escaneo por Gitleaks
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e #corresponde al SHA de la 3er version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  #gGitHub actions lo genera automaticamente

  # ──────────────────────────────────────────────
  # JOB 3: Trivy filesystem
  # ──────────────────────────────────────────────

  trivy_filesystem:
    name: Analisis de Trivy modo Filesystem
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Escaneo Trivy Filesystem
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 #v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          trivyignores: '.trivyignore'  # eliminar posteriormente a la creacion de la imagen
          format: 'json'
          output: 'trivy-fs.json'
          exit-code: '0'

      - name: Quality Gate - trivy_filesystem
        run: |
          echo "Vulnerabilidades HIGH o CRITICAL detectadas:"

          jq -r '
            .Results[]?
            | select(
                any(.Vulnerabilities[]?;
                  .Severity == "HIGH" or .Severity == "CRITICAL"
                )
              )
            | "Archivo: \(.Target) | Tipo: \(.Type)"
          ' trivy-fs.json

          jq -e '
            [.Results[]?.Vulnerabilities[]?
            | select(
                (.Severity == "CRITICAL" or .Severity == "HIGH")
                and (.FixedVersion == null or .FixedVersion == "")
              )
            ] | length == 0
          ' trivy-fs.json

  # ──────────────────────────────────────────────
  # JOB 4: Ejecutar Terraform
  # ──────────────────────────────────────────────
  Infraestructura:
    name: Infraestructura
    needs: trivy_filesystem
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/infra.yml
    secrets: inherit