name: Infraestructura

on:
  workflow_call:

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Terraform
  # ──────────────────────────────────────────────

  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest

    # Permisos necesarios para leer el repositorio y comentar el PR
    permissions:
      contents: read
      pull-requests: write

    env:
      TF_IN_AUTOMATION: true
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1

    defaults:
      run:
        working-directory: ./terraform

    steps:

      # 1. Obtener el repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instalar Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: true

      # 3. Comprobar formato
      - name: Terraform Format
        run: terraform fmt -check -recursive .

      # 4. Inicializar Terraform y backend S3
      - name: Terraform Init
        run: terraform init -input=false

      # 5. Validar configuración
      - name: Terraform Validate
        run: terraform validate

      # 6. Generar plan
      - name: Terraform Plan
        id: plan
        run: |
          STATUS=0

          terraform plan -input=false -no-color \
            -var-file="dev.tfvars" \
            -out=tfplan > plan.txt 2>&1 || STATUS=$?

          cat plan.txt
          exit "$STATUS"
        continue-on-error: true

      # 7. Publicar resultado del plan en el PR
      - name: Comment Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const result = fs.readFileSync(
              'terraform/plan.txt',
              'utf8'
            );

            const status = '${{ steps.plan.outcome }}';

            const output = `### Terraform Plan - Tero

            Estado: ${status}

            <details>
            <summary>Ver resultado del plan</summary>

            \`\`\`terraform
            ${result.slice(0, 55000)}
            \`\`\`

            </details>

            Autor: @${context.actor}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # 8. Bloquear si falla el plan
      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # 9. Aplicar infraestructura
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

  # ──────────────────────────────────────────────
  # JOB 2: Ejecutar Build, scan y push
  # ──────────────────────────────────────────────

  build-scan-push:
    name: build-scan-push
    needs: terraform
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build-scan-push.yml
    secrets: inherit