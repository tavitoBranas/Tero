  # # ──────────────────────────────────────────────
  # # JOB 2: Gitleaks
  # # ──────────────────────────────────────────────

  # gitleaks:
  #   name: Escaneo por Gitleaks
  #   runs-on: ubuntu-latest
  #   needs: sonarqube

  #   steps:
  #     - name: Checkout del repositorio
  #       uses: actions/checkout@v6
  #       with:
