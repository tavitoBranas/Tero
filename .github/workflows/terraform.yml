  # ──────────────────────────────────────────────
  # JOB 3: Trivy filesystem
  # ──────────────────────────────────────────────

  trivy_filesystem:
    name: Analisis de Trivy modo Filesystem
    runs-on: ubuntu-latest
    #needs: gitleaks

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Escaneo Trivy Filesystem
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 #v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          trivyignores: '.trivyignore'  # eliminar posteriormente a la creacion de la imagen 
          format: 'json'
          output: 'trivy-fs.json'
          exit-code: '0'

      - name: Quality Gate - trivy_filesystem
        run: |
          echo "Vulnerabilidades HIGH o CRITICAL detectadas:"

          jq -r '
            .Results[]?
            | select(
                any(.Vulnerabilities[]?;
                  .Severity == "HIGH" or .Severity == "CRITICAL"
                )
              )
            | "Archivo: \(.Target) | Tipo: \(.Type)"
          ' trivy-fs.json

          jq -e '
            [.Results[]?.Vulnerabilities[]?
            | select(
                (.Severity == "CRITICAL" or .Severity == "HIGH")
                and (.FixedVersion == null or .FixedVersion == "")
              )
            ] | length == 0
          ' trivy-fs.json

  # ──────────────────────────────────────────────
  # JOB 4: Terraform
  # ──────────────────────────────────────────────

  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest
    needs: trivy_filesystem

    # Permisos necesarios para leer el repositorio y comentar el PR
    permissions:
      contents: read
      pull-requests: write

    env:
      TF_IN_AUTOMATION: true
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1

    defaults:
      run:
        working-directory: ./terraform

    steps:

      # 1. Obtener el repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instalar Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: true

      # 3. Comprobar formato
      - name: Terraform Format
        run: terraform fmt -check -recursive .

      # 4. Inicializar Terraform y backend S3
      - name: Terraform Init
        run: terraform init -input=false

      # 5. Validar configuración
      - name: Terraform Validate
        run: terraform validate

      # 6. Generar plan
      - name: Terraform Plan
        id: plan
        run: |
          STATUS=0

          terraform plan -input=false -no-color \
            -var-file="dev.tfvars" \
            -out=tfplan > plan.txt 2>&1 || STATUS=$?

          cat plan.txt
          exit "$STATUS"
        continue-on-error: true

      # 7. Publicar resultado del plan en el PR
      - name: Comment Terraform Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const result = fs.readFileSync(
              'terraform/plan.txt',
              'utf8'
            );

            const status = '${{ steps.plan.outcome }}';

            const output = `### Terraform Plan - Tero

            Estado: ${status}

            <details>
            <summary>Ver resultado del plan</summary>

            \`\`\`terraform
            ${result.slice(0, 55000)}
            \`\`\`

            </details>

            Autor: @${context.actor}`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # 8. Bloquear si falla el plan
      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # 9. Aplicar infraestructura
      - name: Terraform Apply
        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
        run: terraform apply -input=false -auto-approve tfplan


  # ──────────────────────────────────────────────
  # JOB 2: Ejecutar CI/CD después de Terraform
  # ──────────────────────────────────────────────

