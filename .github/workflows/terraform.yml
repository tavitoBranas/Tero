name: Tero Terraform

on:
  # Se ejecuta al crear o actualizar un Pull Request
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  
   # Se ejecuta al integrar cambios en main 
   # (Después del merge a main, Terraform ejecuta el plan y el apply.)
  push:
    branches: [main]

  # Permite ejecución manual
  workflow_dispatch:

# Evita ejecuciones simultáneas sobre el mismo state
concurrency:
  group: tero-terraform
  cancel-in-progress: false

jobs:

