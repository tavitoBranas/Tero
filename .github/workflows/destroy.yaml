name: Tero Terraform Destroy

# Ejecución exclusivamente manual
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribir "destroy" para confirmar'
        required: true

permissions:
  contents: read

# Misma concurrencia que el pipeline Terraform
concurrency:
  group: tero-terraform
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  TF_IN_AUTOMATION: true

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: inputs.confirm == 'destroy'

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
            persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      # Eliminar únicamente infraestructura temporal.
      # NO destruir ECR ni el backend S3.
      - name: Terraform Destroy Plan
        run: |
            terraform plan -destroy -input=false \
            -var-file="dev.tfvars" \
            -target=module.eks \
            -target=module.networking \
            -out=destroy.tfplan

            terraform show -json destroy.tfplan > destroy.json

            if jq -e '
            [.resource_changes[]? |
            select(
                .type == "aws_ecr_repository" and
                (.change.actions | index("delete"))
            )] | length > 0
            ' destroy.json; then
            echo "ERROR: El plan intenta eliminar repositorios ECR."
            exit 1
            fi

      - name: Terraform Destroy
        run: terraform apply -input=false -auto-approve destroy.tfplan

      - name: Verify remaining resources
        run: terraform state list

