name: Tero Terraform Destroy

# Ejecución exclusivamente manual
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribir "destroy" para confirmar'
        required: true

permissions:
  contents: read

# Misma concurrencia que el pipeline Terraform
concurrency:
  group: tero-terraform
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  TF_IN_AUTOMATION: true

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: inputs.confirm == 'destroy'

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
            persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Configure Kubernetes access
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name tero-eks

      - name: Delete Kubernetes Ingress
        shell: bash
        run: |
          for NAMESPACE in test prod; do

            echo "Eliminando Ingress de $NAMESPACE"

            kubectl delete ingress --all \
              --namespace "$NAMESPACE" \
              --ignore-not-found=true \
              --wait=true \
              --timeout=600s

          done

      - name: Verify ALB deletion
        shell: bash
        run: |
          for ATTEMPT in $(seq 1 60); do

            ALB_COUNT=$(aws elbv2 describe-load-balancers \
              --region "$AWS_REGION" \
              --query "length(LoadBalancers[?starts_with(LoadBalancerName, 'k8s-terotest-') || starts_with(LoadBalancerName, 'k8s-teroprod-')])" \
              --output text)

            if [ "$ALB_COUNT" = "0" ]; then
              echo "Todos los ALB de Tero fueron eliminados"
              exit 0
            fi

            echo "ALB pendientes: $ALB_COUNT"
            echo "Esperando - Intento $ATTEMPT de 60"
            sleep 10

          done

          echo "::error::No se eliminaron todos los ALB de Tero"
          exit 1

      - name: Destroy Kubernetes components
        shell: bash
        run: |
          terraform plan -destroy -input=false \
            -var-file="dev.tfvars" \
            -target=module.namespaces \
            -target=module.alb_controller \
            -out=destroy-k8s.tfplan

          terraform apply -input=false \
            -auto-approve destroy-k8s.tfplan

      # Eliminar únicamente infraestructura temporal.
      # NO destruir el backend S3.
      
      # Generar plan de destrucción completa
      - name: Terraform Destroy Plan
        shell: bash
        run: |
          terraform plan -destroy -input=false \
            -var-file="dev.tfvars" \
            -out=destroy.tfplan

          terraform show -json destroy.tfplan > destroy.json

          # Proteger el bucket S3 del state
          if jq -e '
            [.resource_changes[]? |
              select(
                .type == "aws_s3_bucket" and
                .change.before.bucket == "tero-tf.state" and
                (.change.actions | index("delete"))
              )
            ] | length > 0
          ' destroy.json; then
            echo "::error::El plan intenta eliminar el bucket S3 del state"
            exit 1
          fi

      # Ejecutar la destrucción
      - name: Terraform Destroy
        run: terraform apply -input=false -auto-approve destroy.tfplan

      # Verificar recursos restantes
      - name: Verify remaining resources
        shell: bash
        run: |
          REMAINING=$(terraform state list)

          if [ -n "$REMAINING" ]; then
            echo "::error::Todavía existen recursos en el state"
            echo "$REMAINING"
            exit 1
          fi

          echo "Todos los recursos gestionados fueron eliminados"

      # Verificar que el backend S3 sigue disponible
      - name: Verify S3 backend
        run: |
          aws s3api head-bucket --bucket tero-tf.state
          echo "Backend S3 conservado correctamente"

