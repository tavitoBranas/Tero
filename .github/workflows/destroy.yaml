name: Destroy

#### corregir, tomado como ejemplo de la ac2 

# Borra la app y toda la infraestructura. Se ejecuta solo a mano:
# Actions → Destroy → Run workflow → escribir "destroy".
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribir "destroy" para confirmar'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: web-app

jobs:
  destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    if: inputs.confirm == 'destroy'

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          BUCKET="ac2-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          terraform init -input=false -backend-config="bucket=$BUCKET"

      # Primero se borra el Ingress para que el controller elimine el ALB;
      # si no, el ALB y sus security groups bloquean el borrado de la VPC.
      - name: Borrar la app (y el ALB)
        run: |
          CLUSTER=$(terraform output -raw cluster_name 2>/dev/null || true)
          if [ -n "$CLUSTER" ] && aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"; then
            kubectl delete namespace "$K8S_NAMESPACE" --ignore-not-found --timeout=5m || true
            echo "Esperando a que se elimine el ALB..."
            sleep 60
          fi

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve
