name: Deploy DEV

on:
  workflow_call:

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Preparar bases de datos UAT
  # ──────────────────────────────────────────────

  preparacion_bd_UAT:
    name: Preparacion de la bd UAT
    runs-on: ubuntu-latest

    environment: test

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: tero-eks
      NAMESPACE: ${{ vars.NAMESPACE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configuracion de credenciales de AWS
        uses: aws-actions/configure-aws-credentials@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 # v4.0.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configuracion de acceso a K8s
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verify namespace
        run: kubectl get namespace "$NAMESPACE"

      - name: Creacion del secreto de PostgreSQL 
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          kubectl create secret generic postgres-secret \
            --namespace "$NAMESPACE" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy de la bd TEST
        run: |
          for FILE in k8s/database/*.yaml; do
            envsubst '${NAMESPACE}' < "$FILE" | kubectl apply -f -
          done

      - name: Verificacion de la db creada
        run: |
          kubectl rollout status deployment/postgres \
            --namespace "$NAMESPACE" \
            --timeout=300s

          kubectl rollout status deployment/redis \
            --namespace "$NAMESPACE" \
            --timeout=300s

  # ──────────────────────────────────────────────
  # JOB 2: Despliegue en DEV
  # ──────────────────────────────────────────────

  deploy-dev:
    name: Deploy DEV
    runs-on: ubuntu-latest
    needs: preparacion_bd_UAT

    environment: dev

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: tero-eks
      NAMESPACE: ${{ vars.NAMESPACE }}
      REPLICAS: ${{ vars.REPLICAS }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_ENDPOINT: ${{ vars.DB_ENDPOINT }}
      REDIS_URL: ${{ vars.REDIS_URL }}

    steps:

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configuracion de credenciales de AWS
        uses: aws-actions/configure-aws-credentials@4fc4975a852c8cd99761e2de1f4ba73402e44dd9 # v4.0.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configuracion de acceso a K8s
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verificacion del namespace
        run: kubectl get namespace "$NAMESPACE"

      - name: Descarga de los digests de las imagenes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Verificacion de los digests
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do
            FILE="image-digests/$SERVICE.txt"

            if [ ! -s "$FILE" ]; then
              echo "::error::Referencia no encontrada para $SERVICE"
              exit 1
            fi

            IMAGE_URI=$(cat "$FILE")

            if [[ ! "$IMAGE_URI" =~ @sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Digest inválido para $SERVICE"
              exit 1
            fi

            echo "$SERVICE: $IMAGE_URI"
          done

      - name: CReacion del secreto para Admin
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        run: |
          kubectl create secret generic admin-secret \
            --namespace "$NAMESPACE" \
            --from-literal=ADMIN_USERNAME="$ADMIN_USERNAME" \
            --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            --from-literal=ADMIN_JWT_SECRET="$ADMIN_JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Creacion del secreto para PostgreSQL
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          kubectl create secret generic postgres-secret \
            --namespace "$NAMESPACE" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Servicio DEV 
        run: |
          for FILE in k8s/services/*.yaml; do
            envsubst '${NAMESPACE}' < "$FILE" | kubectl apply -f -
          done

      - name: Deploy Microservicios DEV
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do

            export IMAGE_URI=$(cat "image-digests/$SERVICE.txt")

            echo "Desplegando $SERVICE"
            echo "Imagen: $IMAGE_URI"

            envsubst '${NAMESPACE} ${REPLICAS} ${IMAGE_URI} ${DB_HOST} ${DB_ENDPOINT} ${REDIS_URL}' \
              < "k8s/deployments/$SERVICE.yaml" \
              | kubectl apply -f -

          done

      - name: Verificacion del Deployment
        run: |
          for SERVICE in admin cart catalog checkout orders ui; do

            echo "Verificando $SERVICE"

            kubectl rollout status deployment/"$SERVICE" \
              --namespace "$NAMESPACE" \
              --timeout=300s

          done

      - name: Verificacion del Health de DEV
        shell: bash
        run: |
          kubectl run "health-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --namespace "$NAMESPACE" \
            --image=curlimages/curl:8.12.1 \
            --restart=Never \
            --rm -i \
            --command -- sh -ec '
              for SERVICE in admin carts catalog checkout orders ui; do

                echo "Verificando health de $SERVICE"

                curl --fail --silent --show-error \
                  --connect-timeout 5 \
                  --max-time 15 \
                  --retry 3 \
                  "http://$SERVICE:8080/health"

                echo ""
                echo "$SERVICE: OK"

              done
            '
  # ──────────────────────────────────────────────
  # JOB 3: Tero - Deploy TEST
  # ──────────────────────────────────────────────

  deploy_test:
    name: Tero - Deploy TEST
    needs: deploy-dev
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/deploy_test.yml
    secrets: inherit