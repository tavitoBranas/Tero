apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: ${NAMESPACE}

spec:
  replicas: ${REPLICAS}

  selector:
    matchLabels:
      app: admin

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: admin

    spec:
      automountServiceAccountToken: false
      containers:
        - name: admin
          image: ${IMAGE_URI}
          resources:
            requests:
              ephemeral-storage: "64Mi"
              cpu: "100m"
              memory: "128Mi"
            limits:
              ephemeral-storage: "256Mi"
              cpu: "250m"
              memory: "256Mi"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: DB_HOST
              value: "${DB_HOST}"

            - name: DB_PORT
              value: "5432"

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: admin-secret
                  key: ADMIN_USERNAME

            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-secret
                  key: ADMIN_PASSWORD

            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-secret
                  key: ADMIN_JWT_SECRET

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15