apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: ${NAMESPACE}

spec:
  replicas: ${REPLICAS}

  selector:
    matchLabels:
      app: cart

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: cart

    spec:
      containers:
        - name: cart
          image: ${IMAGE_URI}
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: CART_PERSISTENCE_PROVIDER
              value: "postgres"

            - name: CART_POSTGRES_HOST
              value: "${DB_HOST}"

            - name: CART_POSTGRES_PORT
              value: "5432"

            - name: CART_POSTGRES_DB
              value: "cartdb"

            - name: CART_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: CART_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: PORT
              value: "8080"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15