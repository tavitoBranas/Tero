apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ${NAMESPACE}

spec:
  replicas: ${REPLICAS}

  selector:
    matchLabels:
      app: catalog

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: catalog

    spec:
      containers:
        - name: catalog
          image: ${IMAGE_URI}
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: GIN_MODE
              value: "release"

            - name: RETAIL_CATALOG_PERSISTENCE_PROVIDER
              value: "postgres"

            - name: RETAIL_CATALOG_PERSISTENCE_ENDPOINT
              value: "${DB_ENDPOINT}"

            - name: RETAIL_CATALOG_PERSISTENCE_DB_NAME
              value: "catalogdb"

            - name: RETAIL_CATALOG_PERSISTENCE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: RETAIL_CATALOG_PERSISTENCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15