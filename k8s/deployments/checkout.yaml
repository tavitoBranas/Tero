apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: ${NAMESPACE}

spec:
  replicas: ${REPLICAS}

  selector:
    matchLabels:
      app: checkout

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: checkout

    spec:
      automountServiceAccountToken: false
      containers:
        - name: checkout
          image: ${IMAGE_URI}
          resources:
            requests:
              ephemeral-storage: "64Mi"
              cpu: "100m"
              memory: "128Mi"
            limits:
              ephemeral-storage: "256Mi"
              cpu: "250m"
              memory: "256Mi"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: RETAIL_CHECKOUT_PERSISTENCE_PROVIDER
              value: "redis"

            - name: RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL
              value: "${REDIS_URL}"

            - name: RETAIL_CHECKOUT_ENDPOINTS_ORDERS
              value: "http://orders:8080"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15