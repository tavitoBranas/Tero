sonar.projectKey=tavitoBranas_Tero
sonar.organization=tavitobranas

# Analisis de todo el proyecto
sonar.sources=.

# Excepciones de seguridad: HTTP en health checks de DEV, TEST y PROD
sonar.issue.ignore.multicriteria=http1,http2,http3

# DEV
sonar.issue.ignore.multicriteria.http1.ruleKey=githubactions:S5332
sonar.issue.ignore.multicriteria.http1.resourceKey=.github/workflows/deploy_dev.yml

# TEST
sonar.issue.ignore.multicriteria.http2.ruleKey=githubactions:S5332
sonar.issue.ignore.multicriteria.http2.resourceKey=.github/workflows/deploy_test.yml

# PROD
sonar.issue.ignore.multicriteria.http3.ruleKey=githubactions:S5332
sonar.issue.ignore.multicriteria.http3.resourceKey=.github/workflows/deploy_prod.yml